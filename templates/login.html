<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — VoiceScript AI</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #111410;
            --card: #1c211a;
            --border: rgba(255, 255, 255, 0.08);
            --green: #5C8A52;
            --green-bright: #7AB86E;
            --cream: #E8DFC8;
            --amber: #D4883A;
            --red: #C0523A;
            --text: #E2D9C4;
            --text2: #A89F8A;
            --muted: #6B6558;
            --input-bg: #151913;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 40px 0;
        }

        /* Subtle grid overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(92, 138, 82, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(92, 138, 82, 0.04) 1px, transparent 1px);
            background-size: 52px 52px;
            pointer-events: none;
        }

        /* Organic ink blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(110px);
            opacity: 0.12;
            pointer-events: none;
            animation: drift 18s ease-in-out infinite;
        }

        .b1 {
            width: 480px;
            height: 480px;
            background: var(--green);
            top: -180px;
            left: -120px;
        }

        .b2 {
            width: 340px;
            height: 340px;
            background: var(--amber);
            bottom: -100px;
            right: -80px;
            animation-delay: -7s;
        }

        .b3 {
            width: 220px;
            height: 220px;
            background: var(--cream);
            top: 50%;
            left: 55%;
            animation-delay: -12s;
            opacity: 0.06;
        }

        @keyframes drift {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            40% {
                transform: translate(20px, -15px) scale(1.03);
            }

            70% {
                transform: translate(-15px, 20px) scale(0.97);
            }
        }

        .wrap {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            animation: up 0.5s cubic-bezier(.16, 1, .3, 1) both;
        }

        @keyframes up {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: var(--green);
            border-radius: 14px;
            margin-bottom: 14px;
            box-shadow: 0 0 0 1px rgba(92, 138, 82, 0.4), 0 12px 40px rgba(92, 138, 82, 0.25);
        }

        .logo-icon svg {
            width: 28px;
            height: 28px;
            fill: #E8DFC8;
        }

        .logo h1 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            color: var(--text);
            letter-spacing: -0.2px;
        }

        .logo span {
            color: var(--green-bright);
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 36px 32px;
            box-shadow: 0 40px 90px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04);
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .status-pip {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green-bright);
            animation: pulse 2.5s ease infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(122, 184, 110, 0.4);
            }

            50% {
                opacity: 0.6;
                box-shadow: 0 0 0 4px rgba(122, 184, 110, 0);
            }
        }

        .status-row span {
            font-size: 11px;
            font-weight: 600;
            color: var(--green-bright);
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            color: var(--text);
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .sub {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .fg {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 8px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 11px 14px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 9px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(92, 138, 82, 0.2);
        }

        input::placeholder {
            color: #2e3428;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--green);
            color: var(--cream);
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.2s;
            letter-spacing: 0.2px;
            box-shadow: 0 4px 20px rgba(92, 138, 82, 0.3);
        }

        .btn:hover {
            background: var(--green-bright);
            transform: translateY(-1px);
            box-shadow: 0 8px 28px rgba(92, 138, 82, 0.38);
        }

        .btn:active {
            transform: translateY(0);
        }

        .rule {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0;
            color: var(--muted);
            font-size: 12px;
        }

        .rule::before,
        .rule::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .foot {
            text-align: center;
            font-size: 14px;
            color: var(--muted);
        }

        .foot a {
            color: var(--green-bright);
            text-decoration: none;
            font-weight: 500;
        }

        .foot a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="wrap">
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M12 15c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V6zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-2.08c3.39-.49 6-3.39 6-6.92h-2z" />
                </svg>
            </div>
            <h1>Voice<span>Script</span> AI</h1>
        </div>
        <div class="card">
            <div class="status-row">
                <div class="status-pip"></div>
                <span>Secure Login</span>
            </div>
            <h2>Welcome back</h2>
            <p class="sub">Sign in to continue transcribing</p>
            <form method="POST">
                <div class="fg">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="fg">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn">Sign In →</button>
            </form>
            <div class="rule">or</div>
            <div class="foot">Don't have an account? <a href="/register">Create one free</a></div>
        </div>
    </div>
</body>

</html>
