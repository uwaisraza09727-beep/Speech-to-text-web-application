<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — VoiceScript AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #111410;
            --card: #1c211a;
            --border: rgba(255,255,255,0.08);
            --green: #5C8A52;
            --green-bright: #7AB86E;
            --cream: #E8DFC8;
            --amber: #D4883A;
            --text: #E2D9C4;
            --muted: #6B6558;
            --input-bg: #151913;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(92,138,82,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(92,138,82,0.04) 1px, transparent 1px);
            background-size: 52px 52px;
            pointer-events: none;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(110px);
            opacity: 0.11;
            pointer-events: none;
            animation: drift 18s ease-in-out infinite;
        }
        .b1 { width: 460px; height: 460px; background: var(--amber); bottom: -150px; left: -100px; }
        .b2 { width: 360px; height: 360px; background: var(--green); top: -120px; right: -80px; animation-delay: -8s; }
        .b3 { width: 200px; height: 200px; background: var(--cream); top: 35%; right: 18%; animation-delay: -13s; opacity: 0.05; }

        @keyframes drift {
            0%,100% { transform: translate(0,0) scale(1); }
            40% { transform: translate(18px,-14px) scale(1.03); }
            70% { transform: translate(-14px,18px) scale(0.97); }
        }

        .wrap {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            animation: up 0.5s cubic-bezier(.16,1,.3,1) both;
        }

        @keyframes up {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo { text-align: center; margin-bottom: 24px; }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 54px;
            height: 54px;
            background: var(--green);
            border-radius: 14px;
            margin-bottom: 12px;
            box-shadow: 0 0 0 1px rgba(92,138,82,0.4), 0 12px 36px rgba(92,138,82,0.22);
        }

        .logo-icon svg { width: 26px; height: 26px; fill: #E8DFC8; }

        .logo h1 { font-family: 'Playfair Display', serif; font-size: 21px; color: var(--text); }
        .logo span { color: var(--green-bright); }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 36px 32px;
            box-shadow: 0 40px 90px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(212,136,58,0.1);
            border: 1px solid rgba(212,136,58,0.22);
            border-radius: 20px;
            font-size: 11px;
            color: var(--amber);
            margin-bottom: 18px;
            font-weight: 500;
            letter-spacing: 0.4px;
        }

        h2 { font-family: 'Playfair Display', serif; font-size: 25px; color: var(--text); margin-bottom: 6px; line-height: 1.2; }
        .sub { color: var(--muted); font-size: 14px; margin-bottom: 26px; }

        .fg { margin-bottom: 14px; }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 7px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 11px 14px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 9px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(92,138,82,0.2); }
        input::placeholder { color: #2e3428; }

        /* Password strength */
        .strength { display: flex; gap: 4px; margin-top: 8px; }
        .s-bar {
            flex: 1;
            height: 3px;
            border-radius: 3px;
            background: rgba(255,255,255,0.07);
            transition: background 0.3s;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--green);
            color: var(--cream);
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.2s;
            letter-spacing: 0.2px;
            box-shadow: 0 4px 20px rgba(92,138,82,0.3);
        }

        .btn:hover { background: var(--green-bright); transform: translateY(-1px); box-shadow: 0 8px 28px rgba(92,138,82,0.38); }
        .btn:active { transform: translateY(0); }

        .rule {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0;
            color: var(--muted);
            font-size: 12px;
        }
        .rule::before, .rule::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .foot { text-align: center; font-size: 14px; color: var(--muted); }
        .foot a { color: var(--green-bright); text-decoration: none; font-weight: 500; }
        .foot a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="wrap">
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24"><path d="M12 15c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V6zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-2.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </div>
            <h1>Voice<span>Script</span> AI</h1>
        </div>
        <div class="card">
            <div class="tag">✦ Create Account</div>
            <h2>Get started free</h2>
            <p class="sub">Join thousands transcribing smarter</p>
            <form method="POST">
                <div class="fg">
                    <label>Full Name</label>
                    <input type="text" name="name" placeholder="John Doe" required>
                </div>
                <div class="fg">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="fg">
                    <label>Password</label>
                    <input type="password" name="password" id="pw" placeholder="Min. 8 characters" required>
                    <div class="strength">
                        <div class="s-bar" id="s1"></div>
                        <div class="s-bar" id="s2"></div>
                        <div class="s-bar" id="s3"></div>
                        <div class="s-bar" id="s4"></div>
                    </div>
                </div>
                <button type="submit" class="btn">Create Account →</button>
            </form>
            <div class="rule">or</div>
            <div class="foot">Already have an account? <a href="/login">Sign in</a></div>
        </div>
    </div>
    <script>
        const pw = document.getElementById('pw');
        const bars = [document.getElementById('s1'),document.getElementById('s2'),document.getElementById('s3'),document.getElementById('s4')];
        const colors = ['#C0523A','#D4883A','#5C8A52','#7AB86E'];
        pw.addEventListener('input', () => {
            const v = pw.value;
            let score = 0;
            if (v.length >= 6) score++;
            if (v.length >= 10) score++;
            if (/[A-Z]/.test(v) && /[0-9]/.test(v)) score++;
            if (/[^A-Za-z0-9]/.test(v)) score++;
            bars.forEach((b, i) => b.style.background = i < score ? colors[score - 1] : 'rgba(255,255,255,0.07)');
        });
    </script>
</body>
</html>
